==================================================================
 README
==================================================================
 Project     : CLUEOPS - Tactical Deduction System
               Built by Sal, the group’s resident retard, so he can finally stop losing at the one game he supposedly understands.
 Author      : Sal
 Version     : V5 (build 3.8.0)
 Date        : 2026-11-01
 Type        : Single-file web app (HTML, CSS and JavaScript, no libraries)

 PURPOSE
   A Bayesian deduction co-pilot for the board game Clue (Cluedo). It tracks every
   suggestion, rules cards out, and shows the probability of each possible
   envelope combination so you know when to accuse.

 HOW TO USE
   1. Brief  : choose 3 to 6 players, tap who you are, enter your cards.
      For an uneven deal pick "Extra cards to players" or "Leftover face up".
   2. Intel  : enter each suggestion and how every player responded
      (No info, Could NOT disprove, Showed a card); log wrong accusations.
   3. Fusion : chance that each player, or the envelope, holds each card,
      with a Trends view that keeps the same rows and shows each item's
      envelope probability per log entry.
   4. TGT    : every possible combination with its probability, the accuse
      thresholds for three risk styles, and a Ruled out view.
   5. OPORD  : recommended next suggestion for your room and the room to investigate.
   Desktop   : detected automatically (wide screen with a mouse). Intel and Fusion
      share one page, and TGT and OPORD share one page.

 VERSION HISTORY (concept and design: Sal; implementation assisted by Claude)
   V1.0  2026-10 (approx.)  First single-file Clue solver for iPhone: grid, log, combinations.
   V2.0  2026-10 (approx.)  Exact feasibility, uneven deals, face-up cards, ruled-out view, F-35 badge.
   V3.0  2026-10-29  Bayesian redesign specified by Sal: likelihood model, MCMC, information gain.
   V3.1  2026-10-29  Sal's audit build, uploaded for review.
   V3.2  2026-10-31  Audit fixes: reset, rounding, exact ruled-out checks, seeded cache, accuse rule.
   V3.3  2026-10-31  Wrong accusations.
   V3.4  2026-10-31  V5 branding and badge icon, room preview vs recording.
   V3.5  2026-11-01  Simplified next-move tab, highlighted numbers, risk explanation.
   V3.6  2026-11-01  Trend charts, wide palettes, risk threshold bar, tab renaming.
   V3.7  2026-11-01  Engineering layout, desktop mode, Fusion trends table, separate player and
                     envelope palettes, collapsible accusations, tabs Brief/Intel/Fusion/TGT/OPORD.
   V3.8  2026-11-01  CLUEOPS branding, one trend chart per category (thin engineering style),
                     desktop menu labels without symbols.

 HOW IT WORKS
   Exact search certifies which cards and combinations are still possible.
   Probabilities are analytic for a fresh game, otherwise a seeded 6-chain Metropolis sampler
   (swap and 3-cycle moves) is used and labelled approximate with its standard error.
   Suggestions are ranked by bias-corrected expected information gain.
   The accuse advice compares the cautious win chance with the value of waiting one round.
   A logged wrong accusation removes that exact envelope combination.

 DEPLOYMENT
   Upload as index.html to a static host (for example GitHub Pages).
   No server and no external files are needed.

 PRIVACY
   Everything runs in the browser. Game data is stored only on the device
   (localStorage) and is never sent anywhere.

 COMPATIBILITY
   Written for iPhone Safari (iOS 11 and later) and works on current desktop
   and Android browsers.
==================================================================

#tabs button{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:12px;border-right:1px solid #1d262e;border-bottom:2px solid transparent}
#tabs button.on{color:var(--ac);background:rgba(224,179,65,.08);border-bottom-color:var(--ac)}
h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;border-bottom:1px solid var(--line);padding-bottom:5px;margin:20px 0 10px}
h3:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--ac);vertical-align:-1px}
h3.fold{cursor:pointer;-webkit-user-select:none;user-select:none}h3.fold:before{display:none}
.c{background:var(--panel);border:1px solid var(--line);border-radius:2px;position:relative}
.c:before,.c:after{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
.c:before{left:-1px;top:-1px;border-left:2px solid var(--ac);border-top:2px solid var(--ac)}
.c:after{right:-1px;bottom:-1px;border-right:2px solid var(--ac);border-bottom:2px solid var(--ac)}
.b{border-radius:2px;border:1px solid #3b4957;background:#1b242d;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
.b.on{background:var(--ac);border-color:var(--ac);color:#0d1217}.b.go{background:var(--ok);border-color:var(--ok);color:#06210f}.b.x{border:0;background:none}
.chip,.tag,.mebox,.rm,input,select,.cmb{border-radius:2px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid #3b4957;background:#1b242d}.chip.on{border-color:var(--ok);background:var(--ok)}
.mebox{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.rm{font-family:var(--mono);text-transform:uppercase;font-size:12px}
input,select{border:1px solid var(--line)}input.sz,.cmb,.num,.tag{font-family:var(--mono)}.cmb{min-width:112px}.cmb small{text-transform:uppercase}
.bar,.thrbar,.thrbar i,.cb{border-radius:0}.cb{border-bottom:1px solid #202a33}
table{table-layout:fixed;font-family:var(--mono);border:1px solid var(--line)}
col.cn{width:112px}
th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:#10161c}
th,td{height:30px;padding:0 2px}td:first-child,th:first-child{overflow:hidden;text-overflow:ellipsis}
tr.cat td{height:24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sc{float:right;margin-right:6px;color:var(--mu);font-size:10px;letter-spacing:.04em}
td.tc{padding:0;vertical-align:top}td.tc svg{display:block}
.txw{position:relative;height:14px}.txw span{position:absolute;top:0;transform:translateX(-50%);font-size:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:22px;gap:22px;align-items:start}
body.desk main{max-width:1320px;margin:0 auto;padding:18px 28px 80px}
body.desk #tabs{justify-content:center}body.desk #tabs button{flex:0 0 auto;padding:14px 30px}
body.desk .brief{max-width:760px;margin:0 auto}
@media(max-width:360px){col.cn{width:98px}table{font-size:11px}}
header h1{font-size:23px;letter-spacing:.16em}
.hsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ac);margin:4px 0 5px}

/* ===== reasoning engine =====

function model(){

  for(let j=1;j<n;j++){
   const p=(e.s+j)%n,r=e.res[p]||0;
   if(stopped&&r!==0)bad='Log entry '+(idx+1)+' records a response after a player marked No info or after the first card shown. Responses go clockwise and stop at the first card shown.';
   if(r===0){stopped=true;continue;}

function solve(M,ex,lim=300000){

function sample(M){

function dealLikelihood(own,M){

function resetGame(){
 if(!rc){rc=true;render();setTimeout(function(){if(rc){rc=false;render()}},4000);return}
 rc=false;S={n:4,names:[],me:0,hand:[],sizes:defSizes(4),log:[],faceUp:[],left:0,mode:'extra',currentRoom:12,behavior:'uniform',style:'normal',acc:[]};
 R=null;BT=0;T=0;save();newL();render()}
let ACC_OPEN=false;
let AC={p:0,cards:[0,6,12]};
function addAcc(){if(S.acc.some(function(a){return a.cards.join()===AC.cards.join()}))return;S.acc.push({p:AC.p,cards:AC.cards.slice()});save();R=null;render()}
function addL(){
 const res=L.res.slice();res[L.s]=0;
 if(new Set(L.cards).size<3)return;
 S.log.push({s:L.s,cards:L.cards.slice(),res,shown:res.some(r=>r==2)&&L.s==S.me?L.shown:-1});
 save();newL();render()}
render();
</script></body></html>
