==================================================================
 README
==================================================================
 Project     : CDS Clue Edition
               Combat Data System (CDS).
               Built by Sal, the group’s resident retard, so he can finally stop losing.
 Author      : Sal
 Version     : 1.0.0
 Date        : 2026-10-29
 Type        : Single-file web app (HTML, CSS and JavaScript, no libraries)

 PURPOSE
   A deduction co-pilot for the board game Clue (Cluedo). It tracks every
   suggestion, rules cards out, and shows the probability of each possible
   envelope combination so you know when to accuse.

 HOW TO USE
   1. Setup: choose 3 to 6 players, tap who you are, enter your cards.
      For an uneven deal pick "Extra cards to players" or "Leftover face up".
   2. Log: enter each suggestion and how every player responded
      (No info, Could NOT disprove, Showed a card).
   3. Grid: chance that each player, or the envelope, holds each card.
   4. Combos: every possible combination with its probability, plus a
      "Ruled out" view of the cards eliminated so far.

 HOW IT WORKS
   Exact search checks which cards and owners are still possible.
   Probabilities are exact before the first log entry, then estimated by
   simulating valid deals. Contradictory entries are detected and reported.

 DEPLOYMENT
   Upload as index.html to a static host (for example GitHub Pages).
   No server and no external files are needed.

 PRIVACY
   Everything runs in the browser. Game data is stored only on the device
   (localStorage) and is never sent anywhere.

 COMPATIBILITY
   Written for iPhone Safari (iOS 11 and later) and works on current desktop
   and Android browsers.
==================================================================

<title>CDS Clue Edition</title>
<style>
:root{--bg:#101418;--cd:#1b222a;--tx:#eef2f6;--mu:#8b98a5;--ac:#e0b341;--ok:#3ecf8e;--no:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}button{-webkit-appearance:none;appearance:none;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}input[type=text],input[type=number]{-webkit-appearance:none;appearance:none;font-family:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;padding:12px 14px;background:linear-gradient(90deg,#2a1206,#101418)}
header svg{margin-right:12px;flex:none}header h1{margin:0;font-size:23px;letter-spacing:.02em;line-height:1}header h1 span{color:#ff4500}header p{margin:4px 0 0;font-size:12px;line-height:1.35;color:var(--mu)}header div{min-width:0}
#tabs{display:flex;position:-webkit-sticky;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid #2a343e}
#tabs button{flex:1;padding:14px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-size:15px;font-weight:600}
#tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px 12px 80px}h3{margin:18px 0 8px;font-size:15px;color:var(--ac);text-transform:uppercase;letter-spacing:.05em}
.c{background:var(--cd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;margin-bottom:8px}.row>*+*{margin-left:8px}
input,select{background:#0c1014;color:var(--tx);border:1px solid #33404c;border-radius:8px;padding:11px;font-size:16px;min-width:0}
input[type=text]{flex:1}input.sz{width:58px;text-align:center}select{width:100%;margin-bottom:6px}
.b{background:#2a343e;color:var(--tx);border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600}
.b.on{background:var(--ac);color:#111}.b.go{background:var(--ok);color:#06210f;width:100%;margin-top:6px}.b.x{background:none;color:var(--no);padding:4px 10px}.b.tg{flex:1}
.me{display:grid;grid-gap:6px;gap:6px;margin-bottom:10px}.me .mebox{min-width:0;white-space:nowrap}
.mebox{padding:14px 2px;border:3px solid #33404c;border-radius:12px;background:#0c1014;color:var(--tx);font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.mebox.on{border-color:var(--ac);background:#3a2e0c;color:var(--ac)}
.cmb{min-width:96px;text-align:center;background:#0c1014;border:1px solid #33404c;border-radius:8px;padding:6px 8px;font-weight:700;color:var(--ac)}.cmb small{display:block;color:var(--mu);font-size:10px;font-weight:400}
.chips{display:flex;flex-wrap:wrap}.chip{margin:0 6px 6px 0;padding:9px 12px;border-radius:20px;background:#2a343e;border:0;color:var(--tx);font-size:14px}.chip.on{background:var(--ok);color:#06210f;font-weight:700}.chip.f.on{background:#6aa9ff}
.tag{display:inline-block;padding:8px 12px;border-radius:20px;font-size:14px;margin:0 6px 6px 0}.tag.p{background:#14392b;color:#7ff0bb}.tag.r{background:#3a1d1d;color:#ff9a9a}.tag small{opacity:.8}
.mu{color:var(--mu);font-size:13px}.warn{color:var(--no)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 3px;text-align:center;border-bottom:1px solid #222c35}
th{position:-webkit-sticky;position:sticky;top:48px;background:var(--bg);font-size:11px}td:first-child,th:first-child{text-align:left;padding-left:6px;white-space:nowrap}
tr.cat td{background:#222c35;color:var(--ac);font-weight:700;text-align:left}td.env{outline:1px solid var(--ac);outline-offset:-1px;font-weight:700}
.bar{height:8px;border-radius:4px;background:#2a343e;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:20px;font-weight:700}.lg{display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #2a343e}
.lg>*+*,.cb>*+*{margin-left:8px}.cb{position:relative;display:flex;justify-content:space-between;padding:10px 8px;border-bottom:1px solid #222c35;font-size:14px;overflow:hidden}.cb i{position:absolute;left:0;top:0;bottom:0;background:rgba(224,179,65,.28)}.cb span,.cb b{position:relative}.cb b{white-space:nowrap}
@media(max-width:360px){main{padding:10px 8px 80px}table{font-size:11px}th{font-size:9px}th,td{padding:6px 1px}.chip{padding:8px 10px;font-size:13px}.big{font-size:18px}.b{padding:11px 12px;font-size:15px}.cmb{min-width:80px}}
@media(min-width:700px){main{max-width:640px;margin:0 auto}}

<svg width="56" height="56" aria-label="CDS Clue Edition F-35 badge" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0f1a24" stroke="#ff4500" stroke-width="3"/>
<g transform="translate(32 32) scale(.92) translate(-32 -32.75)" stroke="#0a1118" stroke-width=".8" stroke-linejoin="round">
<path d="M38.5 28L51 39V43.5L38.5 47.5ZM25.5 28L13 39V43.5L25.5 47.5Z" fill="#c4cfd9"/>
<path d="M37 49L44 55V57.5L36 60ZM27 49L20 55V57.5L28 60Z" fill="#b3c0cc"/>
<path d="M36.8 45L40.6 49.5L39.8 51L36.4 47ZM27.2 45L23.4 49.5L24.2 51L27.6 47Z" fill="#8797a6"/>
<path d="M32 4L33.4 10L34.8 16L36.5 22L37.8 28L38.6 34V44L37.6 50L36.5 56L35 60L32 61.5L29 60L27.5 56L25.5 50L24.5 44V34L25.5 28L27.5 22L29.2 16L30.6 10Z" fill="#dbe3ea"/>

<div><h1>CDS: <span>Clue Edition</span></h1><p>Built by Sal, the group’s resident retard, so he can finally stop losing.</p></div>
</header>
<div id="tabs"></div><main id="m"></main>
<script>
const CAT=[["Scarlett","Mustard","White","Green","Peacock","Plum"],["Candlestick","Dagger","Lead Pipe","Revolver","Rope","Wrench"],["Kitchen","Ballroom","Conservatory","Dining Room","Billiard Room","Library","Lounge","Hall","Study"]];
const CN=["Suspects","Weapons","Rooms"],ALL=[].concat(...CAT),catOf=i=>i<6?0:i<12?1:2,CS=[0,6,12];
const defSizes=(n,t=18)=>Array.from({length:n},(_,i)=>Math.floor(t/n)+(i<t%n?1:0));
const choose=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
let S;try{S=JSON.parse(localStorage.getItem('clue2'))}catch(e){}
if(!S)S={n:4,names:[],me:0,hand:[],sizes:defSizes(4),log:[],faceUp:[]};
S.faceUp=S.faceUp||[];S.left=(S.left===undefined||S.left===null)?S.faceUp.length:S.left;if(S.mode=='down')S.mode='up';if(S.mode!='up')S.mode='extra';
const save=()=>{try{localStorage.setItem('clue2',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const nm=p=>S.names[p]||('P'+(p+1));
let T=0,BT=0,R=null,L=null;
const newL=()=>{L={s:S.me,cards:[0,6,12],res:Array(S.n).fill(0),shown:-1}};
newL();

/* ===== reasoning engine =====
 owners: 0..n-1 players, n = envelope, n+1 = leftover pile (face up = known cards, face down = unknown cards).
 Hard constraints: each card has exactly one owner; envelope = 1 suspect+1 weapon+1 room;
 each player holds exactly their stated count; leftover pile holds exactly "left" cards;
 "could NOT disprove" => holds none of the 3; "showed unseen card" => holds at least one of the 3;
 "showed known card" => holds that card. */
function model(){
 const n=S.n,K=n+2,up=S.mode=='up',forbid=ALL.map(()=>Array(K).fill(false)),fixed=Array(21).fill(-1),clauses=[];let bad=null;
 const fix=(c,o)=>{if(fixed[c]>=0&&fixed[c]!=o)bad=ALL[c]+' is claimed by two different holders (your hand, face-up cards and shown cards must not overlap).';fixed[c]=o};
 for(let c=0;c<21;c++){
  if(S.hand.includes(c))fix(c,S.me);else forbid[c][S.me]=true;
  if(up){if(S.faceUp.includes(c))fix(c,n+1);else forbid[c][n+1]=true}}
 S.log.forEach(e=>e.res.forEach((r,p)=>{
  if(p==e.s)return;
  if(r==1)e.cards.forEach(c=>forbid[c][p]=true);
  if(r==2){if(e.shown>=0)fix(e.shown,p);else clauses.push([p,e.cards])}}));
 return{n,forbid,fixed,clauses,bad};
}
function solve(M,ex,lim=300000){
 const n=M.n,forbid=M.forbid,fixed=M.fixed,clauses=M.clauses,E=n,K=n+2,cap=[...S.sizes,3,S.left],fx=fixed.slice();
 for(const e of(ex?(Array.isArray(ex)?ex:[ex]):[])){if(fx[e.c]>=0&&fx[e.c]!=e.o)return null;fx[e.c]=e.o}
 const own=Array(21).fill(-1),cnt=Array(K).fill(0),ec=[0,0,0];let nodes=0,hit=false;
 const order=[...Array(21).keys()].sort(()=>Math.random()-.5).sort((a,b)=>(fx[a]<0)-(fx[b]<0));
 const okCl=()=>clauses.every(function(cl){const p=cl[0];return cl[1].some(function(c){return own[c]==p||(own[c]<0&&!forbid[c][p]&&(fx[c]<0||fx[c]==p)&&cnt[p]<cap[p])})});
 function dfs(k){
  if(++nodes>lim){hit=true;return false}
  if(k==21)return true;
  const c=order[k],ds=[];
  for(let o=0;o<K;o++){
   if(forbid[c][o]||(fx[c]>=0&&fx[c]!=o)||cnt[o]>=cap[o])continue;
   if(o==E&&ec[catOf(c)]>=1)continue;ds.push(o)}
  ds.sort(()=>Math.random()-.5);
  for(const o of ds){own[c]=o;cnt[o]++;if(o==E)ec[catOf(c)]++;
   if(okCl()&&dfs(k+1))return true;
   if(hit)return false;
   own[c]=-1;cnt[o]--;if(o==E)ec[catOf(c)]--}
  return false}
 if(dfs(0))return own;
 return hit?'cap':null}
function feasible(M){
 const K=M.n+2,F=ALL.map(()=>Array(K).fill(false));
 const s0=solve(M);if(!s0||s0=='cap')return{start:s0};
 const mark=o=>o.forEach((x,c)=>F[c][x]=true);mark(s0);
 for(let c=0;c<21;c++)for(let o=0;o<K;o++){
  if(F[c][o]||M.forbid[c][o]||(M.fixed[c]>=0&&M.fixed[c]!=o))continue;
  const r=solve(M,{c,o});
  if(r=='cap')F[c][o]=true;else if(r)mark(r)}
 return{F}}
function sample(M){
 const n=M.n,E=n,K=n+2,forbid=M.forbid,fixed=M.fixed,clauses=M.clauses;
 const F=ALL.map(()=>Array(K).fill(0)),J={};let m=0;
 for(let ch=0;ch<6;ch++){
  const own=solve(M);if(!own||own=='cap')continue;
  const valid=l=>{
   for(const c of l)if(forbid[c][own[c]]||(fixed[c]>=0&&fixed[c]!=own[c]))return false;
   const e=[0,0,0];for(let c=0;c<21;c++)if(own[c]==E)e[catOf(c)]++;
   if(e[0]!=1||e[1]!=1||e[2]!=1)return false;
   return clauses.every(function(cl){return cl[1].some(function(c){return own[c]==cl[0]})})};
  const sw=(i,j)=>{const t=own[i];own[i]=own[j];own[j]=t};
  for(let i=0;i<9000;i++){
   const a=Math.random()*21|0,b=Math.random()*21|0;
   if(Math.random()<.7){
    if(own[a]!=own[b]){sw(a,b);if(!valid([a,b]))sw(a,b)}
   }else{
    const c=Math.random()*21|0;
    if(a!=b&&b!=c&&a!=c){const oa=own[a],ob=own[b],oc=own[c];own[a]=ob;own[b]=oc;own[c]=oa;
     if(!valid([a,b,c])){own[a]=oa;own[b]=ob;own[c]=oc}}}
   if(i>=3000&&i%4==0){m++;let s,w,r;
    for(let c=0;c<21;c++){F[c][own[c]]++;if(own[c]==E){if(c<6)s=c;else if(c<12)w=c;else r=c}}
    const k=s+','+w+','+r;J[k]=(J[k]||0)+1}}}
 return m?{P:F.map(r=>r.map(x=>x/m)),J,m}:null}
// exact starting probabilities (no log): envelope uniform among unknown cards of each category, rest split by hand size
function exactQ(){
 const E=S.n,K=E+2,up=S.mode=='up',kn=new Set(S.hand.concat(up?S.faceUp:[]));
 const u=[0,1,2].map(k=>CAT[k].filter((_,i)=>!kn.has(CS[k]+i)).length);
 const oth=S.sizes.reduce((a,b,i)=>i==S.me?a:a+b,0)||1;
 return ALL.map((_,c)=>{
  const q=Array(K).fill(0);
  if(S.hand.includes(c))q[S.me]=1;
  else if(up&&S.faceUp.includes(c))q[E+1]=1;
  else{const pe=1/u[catOf(c)];q[E]=pe;for(let p=0;p<E;p++)if(p!=S.me)q[p]=(1-pe)*S.sizes[p]/oth}
  return q})}
function calc(){
 $('m').innerHTML='<p class="mu">Calculating…</p>';
 setTimeout(()=>{
  const f=S.left,sum=S.sizes.reduce((a,b)=>a+b,0),M=model();let err=null,out=null;
  if(sum+f!=18)err='Hands ('+sum+') + leftover ('+f+') must equal 18. Fix it in Setup.';
  else if(S.mode=='up'&&S.faceUp.length!=f)err='Select exactly '+f+' face-up cards in Setup (or set the leftover number to '+S.faceUp.length+').';
  else if(S.hand.length!=S.sizes[S.me])err='Select exactly '+S.sizes[S.me]+' cards in your hand (Setup tab).';
  else if(M.bad)err=M.bad;
  else{
   const fe=feasible(M);
   if(!fe.F)err=fe.start=='cap'?'Too complex to verify exactly. Try removing a log entry.':'CONTRADICTION: no possible deal fits all entries. A log entry or your hand is wrong — delete the wrong entry in Log.';
   else{
    const ex=!S.log.length,sm=ex?{P:exactQ(),J:{},m:0}:sample(M);
    if(!sm)err='Could not sample deals. Check your entries.';
    else{
     const K=S.n+2,E=S.n,P=[],D=[];
     for(let c=0;c<21;c++){
      const nf=fe.F[c].filter(Boolean).length;P[c]=[];D[c]=[];
      for(let o=0;o<K;o++){
       const feas=fe.F[c][o],v=!feas?0:nf==1?1:sm.P[c][o];
       P[c][o]=v}
      const fl=P[c].map(v=>Math.floor(v*100+1e-9)),ord=P[c].map((v,o)=>[v*100-fl[o],o]).filter(x=>P[c][x[1]]>0).sort((x,y)=>y[0]-x[0]);
      for(let i=0,d=100-fl.reduce((x,y)=>x+y,0);i<d&&i<ord.length;i++)fl[ord[i][1]]++;
      for(let o=0;o<K;o++)D[c][o]=!fe.F[c][o]?'·':nf==1?'✓':fl[o]==0?'<1':fl[o]}
     // every possible envelope combination (exactly verified), with sampled probability
     const cand=[0,1,2].map(k=>CAT[k].map((_,i)=>CS[k]+i).filter(c=>fe.F[c][E])),combos=[],nc=cand[0].length*cand[1].length*cand[2].length;
     for(const s of cand[0])for(const w of cand[1])for(const r of cand[2]){
      if(ex){combos.push({k:[s,w,r],p:1/nc});continue}
      const cn=sm.J[s+','+w+','+r]||0;
      if(cn>0)combos.push({k:[s,w,r],p:cn/sm.m});
      else if(solve(M,[{c:s,o:E},{c:w,o:E},{c:r,o:E}],60000))combos.push({k:[s,w,r],p:0})}
     combos.sort((a,b)=>b.p-a.p);
     out={P,D,F:fe.F,combos,m:sm.m,ex}}}}
  R=err?{err}:out;render()},30)}

/* ===== views ===== */
function baseCounts(){const kn=new Set(S.hand.concat(S.mode=='up'?S.faceUp:[]));return [0,1,2].map(k=>CAT[k].filter((_,i)=>!kn.has(CS[k]+i)).length)}
const fmtP=p=>p<.0005?'<0.1%':(p*100).toFixed(1)+'%';
function chipsFor(sel,fn,cls=''){return CAT.map((cs,k)=>`<div class="mu" style="margin:8px 0 4px">${CN[k]}</div><div class="chips">`+cs.map((x,i)=>{const c=CS[k]+i;return`<button class="chip ${cls} ${sel(c)?'on':''}" onclick="${fn}(${c})">${x}</button>`}).join('')+'</div>').join('')}
function vSetup(){
 const n=S.n,r=18%n,q=Math.floor(18/n),sum=S.sizes.reduce((a,b)=>a+b,0),f=S.left,up=S.mode=='up',ok=sum+f==18;
 const spread=Math.max(...S.sizes)-Math.min(...S.sizes);
 const rw=r>0&&((up&&f!=r)||(!up&&spread>1));
 const rule=r==0?`Even deal: ${q} cards each, no leftover.`:up?(f==r?`Leftover face up: every player gets ${q}, the other ${r} card(s) go face up for all to see.`:`Rule: ${n} players leave ${r} leftover card(s).`):(spread>1?'Rule: no player may hold more than one card more than another.':`Extra cards: ${r} player(s) hold ${q+1}, the rest ${q}. Set each hand size below.`);
 const left=baseCounts(),cb=left[0]*left[1]*left[2];
 return`<h3>Players</h3><div class="row">${[3,4,5,6].map(k=>`<button class="b tg ${S.n==k?'on':''}" onclick="setN(${k})">${k}</button>`).join('')}</div>
 <h3>Me</h3><div class="me" style="grid-template-columns:repeat(${S.n},minmax(0,1fr))">${Array.from({length:S.n},(_,p)=>`<button class="mebox ${S.me==p?'on':''}" onclick="setMe(${p})">${nm(p)}</button>`).join('')}</div>
 ${r>0?`<h3>Uneven deal</h3><div class="row"><button class="b tg ${up?'':'on'}" onclick="setMode('extra')">Extra cards to players</button><button class="b tg ${up?'on':''}" onclick="setMode('up')">Leftover face up</button></div>`:''}
 <div class="c"><div class="${rw?'warn':'mu'}" style="margin-bottom:8px">${rule}</div>
 <div class="mu" style="margin-bottom:6px">Seat order clockwise · cards in hand</div>
 ${Array.from({length:S.n},(_,p)=>`<div class="row"><input type="text" value="${nm(p)}" onchange="S.names[${p}]=this.value;save();render()"><input class="sz" type="number" inputmode="numeric" min="0" value="${S.sizes[p]}" onchange="S.sizes[${p}]=+this.value;save();render()"></div>`).join('')}
 <div class="row" style="margin-top:10px"><span style="flex:1">Leftover cards</span><input class="sz" type="number" inputmode="numeric" min="0" max="18" value="${f}" ${up?'':'disabled'} onchange="setLeft(+this.value)"><div class="cmb"><small>combos left</small>${cb.toLocaleString()}</div></div>
 <div class="mu">${up&&S.faceUp.length<f?`<div class="warn" style="margin-bottom:4px">Select ${f-S.faceUp.length} more face-up card(s) to update the combinations.</div>`:''}Combinations = suspects × weapons × rooms<br>= ${left[0]} × ${left[1]} × ${left[2]} = ${cb.toLocaleString()} (your hand and face-up cards removed)</div>
 <div class="${ok?'mu':'warn'}" style="margin-top:6px">Hands ${sum} + leftover ${f} + envelope 3 = ${sum+f+3} / 21${ok?'':' — must total 21'}</div></div>
 <h3>My cards (${S.hand.length}/${S.sizes[S.me]})</h3><div class="c">${chipsFor(c=>S.hand.includes(c),'tgHand')}</div>
 ${up&&f>0?`<h3>Face-up cards (${S.faceUp.length}/${f})</h3><div class="c">${chipsFor(c=>S.faceUp.includes(c),'tgFace','f')}</div>`:''}
 <button class="b" style="width:100%;${rc?'background:var(--no);color:#fff':''}" onclick="resetGame()">${rc?'Tap again to erase everything':'Reset game'}</button>`}
function vLog(){
 const o=(a,sel)=>a.map((x,i)=>`<option value="${i}" ${i==sel?'selected':''}>${x}</option>`).join('');
 const showed=L.res.some((r,p)=>r==2&&p!=L.s);
 return`<h3>New suggestion</h3><div class="c">
 <div class="mu">Who suggested?</div><select onchange="L.s=+this.value;L.res[L.s]=0;render()">${o(Array.from({length:S.n},(_,p)=>nm(p)),L.s)}</select>
 ${[0,1,2].map(k=>`<select onchange="L.cards[${k}]=${CS[k]}+ +this.value">${o(CAT[k],L.cards[k]-CS[k])}</select>`).join('')}
 <div class="mu" style="margin:6px 0">Response of each player</div>
 ${Array.from({length:S.n},(_,p)=>p==L.s?'':`<div class="row"><div style="width:90px;font-weight:600">${nm(p)}</div><select style="margin:0" onchange="L.res[${p}]=+this.value;render()">${o(['No info','Could NOT disprove','Showed a card'],L.res[p])}</select></div>`).join('')}
 ${showed&&L.s==S.me?`<div class="mu">Card you were shown</div><select onchange="L.shown=+this.value">${`<option value="-1">Unknown</option>`+L.cards.map(c=>`<option value="${c}" ${L.shown==c?'selected':''}>${ALL[c]}</option>`).join('')}</select>`:''}
 <button class="b go" onclick="addL()">Add to log</button></div>
 <h3>Log (${S.log.length})</h3><div class="c">${S.log.length?S.log.map((e,i)=>`<div class="lg"><div><b>${nm(e.s)}</b>: ${e.cards.map(c=>ALL[c]).join(' · ')}<br><span class="mu">${e.res.map((r,p)=>r==1?nm(p)+' passed':r==2?nm(p)+' showed'+(e.shown>=0?' ('+ALL[e.shown]+')':''):'').filter(Boolean).join(' · ')||'nobody responded'}</span></div><button class="b x" onclick="S.log.splice(${i},1);save();render()">✕</button></div>`).join(''):'<span class="mu">Nothing yet</span>'}</div>`}
function vGrid(){
 if(!R)return'';if(R.err)return`<p class="warn">${R.err}</p>`;
 const f=S.left,cols=S.n+1+(f?1:0);
 let h=`<p class="mu">Chance each player (or the envelope) holds the card, ${R.ex?'Exact values (no log entries yet).':'Estimated from '+R.m+' simulated deals.'} ✓ certain · · impossible (both verified exactly, not sampled).</p><table><tr><th></th>${Array.from({length:S.n},(_,p)=>`<th>${nm(p).slice(0,5)}</th>`).join('')}<th style="color:var(--ac)">ENV</th>${f?`<th>TABLE</th>`:''}</tr>`;
 const order=[...Array(S.n).keys(),S.n].concat(f?[S.n+1]:[]);
 CAT.forEach((cs,k)=>{h+=`<tr class="cat"><td colspan="${cols+1}">${CN[k]}</td></tr>`;
  cs.forEach((x,i)=>{const c=CS[k]+i;h+=`<tr><td>${x}</td>`+order.map(o=>{const v=R.P[c][o];return`<td class="${o==S.n?'env':''}" style="background:${o==S.n?`rgba(224,179,65,${v*.8})`:o>S.n?`rgba(106,169,255,${v*.7})`:`rgba(62,207,142,${v*.7})`}">${R.D[c][o]}</td>`}).join('')+'</tr>'})});
 return h+'</table>'}
function vBest(){
 if(!R)return'';if(R.err)return`<p class="warn">${R.err}</p>`;
 const E=S.n,C=R.combos,sub=`<div class="row"><button class="b tg ${BT==0?'on':''}" onclick="BT=0;render()">Combinations</button><button class="b tg ${BT==1?'on':''}" onclick="BT=1;render()">Ruled out</button></div>`;
 if(BT==0){
  const t=C[0],ready=t.p>=.85;
  const hidden=new Set(S.hand.concat(S.mode=='up'?S.faceUp:[]));
  const pick=k=>{let best=-1,bv=-1;CAT[k].forEach((_,i)=>{const c=CS[k]+i,v=R.P[c][E];if(!hidden.has(c)&&v<.995&&v>bv){bv=v;best=c}});return best};
  const sg=[0,1,2].map(pick);
  return sub+`<div class="c"><div class="mu">Possible combinations: <b>${C.length}</b> of ${baseCounts().reduce((a,b)=>a*b,1)}</div><div class="big">${t.k.map(c=>ALL[c]).join(' · ')}</div><div class="bar"><i style="width:${t.p*100}%"></i></div>
  <div style="${ready?'color:var(--ok);font-weight:700':'color:var(--mu)'}">${fmtP(t.p)} — ${ready?'ACCUSE NOW (when it is your turn)':'keep investigating'}</div></div>
  <div class="c"><div class="mu">Best next suggestion</div><div class="big">${sg.map(c=>c<0?'—':ALL[c]).join(' · ')}</div><div class="mu" style="margin-top:6px">Highest envelope odds per category among cards you don’t hold.</div></div>
  <h3>All combinations (${C.length})</h3><div class="c" style="padding:4px">${C.map(x=>`<div class="cb"><i style="width:${x.p*100}%"></i><span>${x.k.map(c=>ALL[c]).join(' · ')}</span><b>${fmtP(x.p)}</b></div>`).join('')}</div>`}
 const left=CAT.map((cs,k)=>cs.filter((_,i)=>R.F[CS[k]+i][E]).length);
 const owner=c=>{const os=R.F[c].map((v,o)=>v?o:-1).filter(o=>o>=0);return os.length==1?(os[0]<S.n?nm(os[0]):os[0]==E?'Envelope':'Leftover'):''};
 let h=sub+`<div class="c"><div class="mu">Options remaining</div><div class="big">${left[0]} suspects · ${left[1]} weapons · ${left[2]} rooms</div><div class="mu" style="margin-top:4px">${C.length} combinations still possible</div></div>`;
 CAT.forEach((cs,k)=>{
  const pos=cs.map((x,i)=>({x:x,c:CS[k]+i})).filter(o=>R.F[o.c][E]),out=cs.map((x,i)=>({x:x,c:CS[k]+i})).filter(o=>!R.F[o.c][E]);
  h+=`<h3>${CN[k]}</h3><div class="c"><div class="mu" style="margin-bottom:6px">Still possible (${pos.length})</div>${pos.map(o=>`<span class="tag p">${o.x} <small>${Math.round(R.P[o.c][E]*100)}%</small></span>`).join('')||'<span class="mu">none</span>'}
  <div class="mu" style="margin:8px 0 6px">Ruled out (${out.length})</div>${out.map(o=>`<span class="tag r"><s>${o.x}</s>${owner(o.c)?` <small>→ ${owner(o.c)}</small>`:''}</span>`).join('')||'<span class="mu">none yet</span>'}</div>`});
 return h}
function render(){
 $('tabs').innerHTML=['Setup','Log','Grid','Combos'].map((x,i)=>`<button class="${T==i?'on':''}" onclick="go(${i})">${x}</button>`).join('');
 if((T==2||T==3)&&!R)return calc();
 $('m').innerHTML=[vSetup,vLog,vGrid,vBest][T]();
}
function go(i){T=i;if(i>1)R=null;render()}
function applyMode(){const n=S.n;if(S.mode=='extra'){S.left=0;S.faceUp=[];S.sizes=defSizes(n,18)}else{S.left=18%n;S.faceUp=S.faceUp.slice(0,S.left);S.sizes=defSizes(n,18-S.left)}}
function setN(k){S.n=k;S.names=S.names.slice(0,k);if(18%k==0)S.mode='extra';applyMode();S.me=0;S.hand=[];S.log=[];save();newL();render()}
function setMe(p){S.me=p;S.hand=[];save();newL();render()}
function tgHand(c){if(S.mode=='up'&&S.faceUp.includes(c))return;const i=S.hand.indexOf(c);i<0?S.hand.push(c):S.hand.splice(i,1);save();render()}
function tgFace(c){if(S.hand.includes(c))return;const i=S.faceUp.indexOf(c);if(i<0){if(S.faceUp.length>=S.left)return;S.faceUp.push(c)}else S.faceUp.splice(i,1);save();render()}
function setLeft(v){if(S.mode!='up')return;v=Math.max(0,Math.min(18,v|0));S.left=v;S.faceUp=S.faceUp.slice(0,v);S.sizes=defSizes(S.n,18-v);save();render()}
function setMode(m){S.mode=m;applyMode();save();render()}
let rc=false;
function resetGame(){
 if(!rc){rc=true;render();setTimeout(function(){if(rc){rc=false;render()}},4000);return}
 rc=false;S={n:4,names:[],me:0,hand:[],sizes:defSizes(4),log:[],faceUp:[],left:0,mode:'extra'};
 R=null;BT=0;T=0;save();newL();render()}
function addL(){
 const res=L.res.slice();res[L.s]=0;
 if(new Set(L.cards).size<3)return;
 S.log.push({s:L.s,cards:L.cards.slice(),res,shown:res.some(r=>r==2)&&L.s==S.me?L.shown:-1});
 save();newL();render()}
render();
</script></body></html>
